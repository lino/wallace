[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "wallace-audit"
dynamic = ["version"]
description = "Forensic token usage and USD cost auditor for Antigravity, Claude Code, Grok CLI, and Codex sessions, named after Oscar Wallace."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lino" }]
keywords = [
  "tokens",
  "cost",
  "audit",
  "llm",
  "cli",
  "prometheus",
  "antigravity",
  "claude",
  "codex",
  "grok",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = [
  "genai-prices>=0.2",
  "jsonschema>=4.23.0",
  "prometheus-client>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/lino/wallace"
Repository = "https://github.com/lino/wallace"
Issues = "https://github.com/lino/wallace/issues"
Documentation = "https://lino.github.io/wallace/"

[project.scripts]
wallace = "wallace.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "types-jsonschema>=4.23.0",
  "zensical>=0.0.20",
]

[tool.hatch.version]
path = "src/wallace/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src/wallace",
  "/schemas",
  "/man",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wallace"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "N",
  "D",
  "UP",
  "B",
  "C4",
  "C90",
  "SIM",
  "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=wallace --cov-report=term-missing"
